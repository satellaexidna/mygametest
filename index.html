<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b0000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="赤い糸">
  <link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赤い糸 — Красная нить</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Special+Elite&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
  :root {
    --blood:#8b0000; --dark:#050508; --white:#f0e8e8;
    --glitch1:#ff003c; --glitch2:#00ffcc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--dark);color:var(--white);font-family:'Crimson Text',serif;overflow:hidden;height:100dvh;width:100vw;user-select:none;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:0.35;}

  #audio-btn{position:fixed;top:14px;right:14px;z-index:500;background:rgba(5,5,8,0.75);border:1px solid rgba(139,0,0,0.35);color:rgba(200,184,184,0.65);font-size:17px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:all 0.2s;}
  #audio-btn:active{background:rgba(139,0,0,0.3);color:var(--white);}

  #game{width:100%;height:100dvh;position:relative;display:flex;flex-direction:column;}
  #bg{position:absolute;inset:0;transition:background 1.2s ease;z-index:0;}
  #sprite-wrap{position:absolute;bottom:28%;left:50%;transform:translateX(-50%);z-index:2;width:min(260px,62vw);transition:filter 0.8s ease;}
  #sprite-img{width:100%;display:block;filter:drop-shadow(0 0 20px rgba(139,0,0,0.5));transition:filter 0.8s,opacity 0.5s;border-radius:4px;}
  #vignette{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.9) 100%);pointer-events:none;transition:background 1s;}
  #distort{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 0.3s;}

  #dialogue-box{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:0 0 env(safe-area-inset-bottom);}
  #name-tag{display:inline-block;background:linear-gradient(90deg,var(--blood),transparent);padding:4px 20px 4px 14px;font-family:'Noto Serif JP',serif;font-size:clamp(13px,3.5vw,16px);font-weight:700;letter-spacing:0.1em;color:var(--white);margin-left:16px;margin-bottom:-1px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 100%,0 100%);}
  #text-panel{background:linear-gradient(180deg,rgba(5,5,8,0.82) 0%,rgba(5,5,8,0.97) 100%);border-top:1px solid rgba(139,0,0,0.5);padding:16px 20px 20px;min-height:120px;backdrop-filter:blur(8px);position:relative;}
  #text-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blood),var(--blood) 60%,transparent);}
  #dialogue-text{font-size:clamp(14px,3.8vw,17px);line-height:1.7;color:var(--white);min-height:3em;font-style:italic;}
  #tap-hint{text-align:right;color:rgba(200,184,184,0.45);font-size:11px;margin-top:8px;animation:blink 1.5s infinite;font-family:'Special Elite',cursive;letter-spacing:0.15em;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
  #choices{display:none;flex-direction:column;gap:10px;margin-top:12px;}
  .choice-btn{background:rgba(139,0,0,0.12);border:1px solid rgba(139,0,0,0.45);color:var(--white);font-family:'Crimson Text',serif;font-size:clamp(13px,3.5vw,15px);padding:10px 16px;cursor:pointer;text-align:left;transition:background 0.2s,transform 0.15s;}
  .choice-btn::before{content:'▸ ';color:var(--blood);}
  .choice-btn:active{background:rgba(139,0,0,0.35);transform:translateX(4px);}

  /* END SCREEN */
  #end-screen{position:fixed;inset:0;z-index:300;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;opacity:0;transition:opacity 2.5s;}
  #end-screen.show{display:flex;}
  #end-screen.visible{opacity:1;}
  #end-kanji{font-family:'Noto Serif JP',serif;font-size:clamp(52px,13vw,90px);color:var(--blood);letter-spacing:0.3em;text-shadow:0 0 60px rgba(139,0,0,0.9);animation:pulse 4s ease-in-out infinite;}
  #end-ru{font-family:'Special Elite',cursive;font-size:clamp(14px,4vw,20px);color:rgba(200,184,184,0.4);letter-spacing:0.7em;text-transform:uppercase;}
  .end-line{width:clamp(80px,20vw,140px);height:1px;background:linear-gradient(90deg,transparent,var(--blood),transparent);}
  #restart-btn{margin-top:16px;background:none;border:1px solid rgba(139,0,0,0.4);color:rgba(200,184,184,0.45);font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.4em;padding:10px 24px;cursor:pointer;text-transform:uppercase;transition:all 0.3s;animation:btnPulse 3s ease-in-out infinite;}
  #restart-btn:hover,#restart-btn:active{background:rgba(139,0,0,0.2);color:var(--white);border-color:var(--blood);}

  @keyframes pulse{0%,100%{text-shadow:0 0 60px rgba(139,0,0,0.8);}50%{text-shadow:0 0 100px rgba(139,0,0,1),0 0 160px rgba(139,0,0,0.5);}}
  .drip{position:absolute;width:3px;background:linear-gradient(180deg,var(--blood),transparent);border-radius:0 0 3px 3px;top:0;z-index:8;animation:drip linear forwards;}
  @keyframes drip{from{height:0}to{height:100px}}
  #flash{position:fixed;inset:0;z-index:100;pointer-events:none;opacity:0;}

  /* TITLE */
  #title-screen{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
  #title-jp{font-family:'Noto Serif JP',serif;font-size:clamp(42px,10vw,60px);color:var(--blood);letter-spacing:0.3em;text-shadow:0 0 40px rgba(139,0,0,0.9);animation:pulse 3s ease-in-out infinite;}
  #title-ru{font-family:'Crimson Text',serif;font-size:clamp(13px,3.5vw,18px);color:rgba(200,184,184,0.5);letter-spacing:0.4em;font-style:italic;}
  #title-sub{font-family:'Special Elite',cursive;font-size:clamp(10px,2.5vw,12px);color:rgba(200,184,184,0.22);letter-spacing:0.5em;text-transform:uppercase;}
  #start-btn{margin-top:32px;background:none;border:1px solid rgba(139,0,0,0.55);color:rgba(200,184,184,0.65);font-family:'Special Elite',cursive;font-size:clamp(12px,3vw,14px);letter-spacing:0.4em;padding:12px 32px;cursor:pointer;text-transform:uppercase;transition:all 0.3s;animation:btnPulse 2s ease-in-out infinite;}
  #start-btn:hover,#start-btn:active{background:rgba(139,0,0,0.2);color:var(--white);border-color:var(--blood);}
  @keyframes btnPulse{0%,100%{opacity:0.7}50%{opacity:1}}
  .deco-line{width:clamp(120px,30vw,200px);height:1px;background:linear-gradient(90deg,transparent,var(--blood),transparent);}
  #title-img{width:min(170px,42vw);border-radius:50%;border:1px solid rgba(139,0,0,0.4);filter:grayscale(0.3) drop-shadow(0 0 20px rgba(139,0,0,0.6));margin-bottom:4px;}
  #kanji-bg{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;}
  #kanji-char{font-family:'Noto Serif JP',serif;font-size:clamp(200px,50vw,400px);color:rgba(139,0,0,0.035);position:absolute;transition:opacity 1.5s;line-height:1;}
  #chapter-card{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;}
  #chapter-card.show{display:flex;}
  #chapter-num{font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.5em;color:var(--blood);text-transform:uppercase;}
  #chapter-title{font-family:'Noto Serif JP',serif;font-size:clamp(20px,5vw,28px);color:var(--white);letter-spacing:0.2em;}
  #sprite-img.changing{opacity:0;transform:scale(0.97);}
</style>
</head>

<script>

//  AUDIO — HTML5 треки
// ═══════════════════════════════════════════════════════════════
let muted = false;
let currentTrack = null;

const _tracks = {
  menu: new Audio("https://cdn.discordapp.com/attachments/1206581194859221002/1501966408580464851/atlasaudio-emotional-piano-510218.mp3?ex=69fea778&is=69fd55f8&hm=36f829a468c687a451997e22e142ea45021f191aa9aba880a8f213d6c378bea3&"),
  game: new Audio("https://cdn.discordapp.com/attachments/1206581194859221002/1501968494890061915/sigmamusicart-horror-horror-trailer-520612.mp3?ex=69fea96a&is=69fd57ea&hm=08e2f5cb24ad1075f4723502ea499bc7edc3987bb151a9c62a9ed67c89115be2&")
};
_tracks.menu.loop = true;
_tracks.game.loop = true;
_tracks.menu.volume = 0;
_tracks.game.volume = 0;

function _fadeIn(audio, target, ms) {
  audio.volume = 0;
  const steps = 40;
  const dt = ms / steps;
  const dv = target / steps;
  let v = 0;
  const t = setInterval(() => {
    v = Math.min(v + dv, target);
    audio.volume = v;
    if (v >= target) clearInterval(t);
  }, dt);
}

function _fadeOut(audio, ms, cb) {
  const dv = audio.volume / (ms / 40);
  const t = setInterval(() => {
    audio.volume = Math.max(0, audio.volume - dv);
    if (audio.volume <= 0) {
      clearInterval(t);
      audio.pause();
      audio.currentTime = 0;
      if (cb) cb();
    }
  }, 40);
}

function playMenuMusic() {
  if (currentTrack === 'menu') return;
  if (currentTrack === 'game') {
    _fadeOut(_tracks.game, 1200, () => {
      currentTrack = 'menu';
      if (!muted) { _tracks.menu.play().catch(()=>{}); _fadeIn(_tracks.menu, 0.5, 2000); }
    });
  } else {
    currentTrack = 'menu';
    if (!muted) { _tracks.menu.play().catch(()=>{}); _fadeIn(_tracks.menu, 0.5, 2000); }
  }
}

function playGameMusic() {
  if (currentTrack === 'game') return;
  if (currentTrack === 'menu') {
    _fadeOut(_tracks.menu, 1500, () => {
      currentTrack = 'game';
      if (!muted) { _tracks.game.play().catch(()=>{}); _fadeIn(_tracks.game, 0.5, 2000); }
    });
  } else {
    currentTrack = 'game';
    if (!muted) { _tracks.game.play().catch(()=>{}); _fadeIn(_tracks.game, 0.5, 2000); }
  }
}

function stopAllMusic(fadeMs) {
  ['menu','game'].forEach(k => {
    if (!_tracks[k].paused) _fadeOut(_tracks[k], fadeMs || 2000);
  });
  currentTrack = null;
}

function toggleMute() {
  muted = !muted;
  document.getElementById('audio-btn').textContent = muted ? '🔇' : '🔊';
  if (muted) {
    Object.values(_tracks).forEach(a => { a.volume = 0; a.pause(); });
  } else {
    if (currentTrack && _tracks[currentTrack]) {
      _tracks[currentTrack].play().catch(()=>{});
      _fadeIn(_tracks[currentTrack], 0.5, 800);
    }
  }
}

  {bg:"radial-gradient(ellipse at 50% 50%,#050010 0%,#000000 100%)",kanji:"消",name:"Акане",sprite:"broken",text:"Красная нить судьбы... Говорят, она связывает двух людей. Говорят, её нельзя разорвать.",sfx:"distort"},
  {bg:"radial-gradient(ellipse at 50% 50%,#050010 0%,#000000 100%)",kanji:"消",name:"Акане",sprite:"broken",text:"Я разорвала её сама. Обмотала вокруг пальца. Он уже синий.",sfx:"glitch"},
  {type:"choice",bg:"#000",kanji:"終",name:"...",sprite:"broken",text:"Окно открыто. Снаружи — бесконечная темнота. Голос Рэя шепчет: «Иди ко мне».",choices:[{text:"Шагнуть к свету",next:23},{text:"Остаться",next:24}]},
  {bg:"#000",kanji:"終",name:"Акане",sprite:"broken",text:"Темнота обняла меня. Тёплая. Как его руки. Красная нить стала белой. Белой. Белой.",sfx:"flash",goto:"end"},
  {bg:"radial-gradient(ellipse at 50% 50%,#050508 0%,#0a0a14 100%)",kanji:"光",name:"Акане",sprite:"normal",text:"Я закрыла окно. Стекло холодное. Реальное. Моя рука реальная. Я всё ещё здесь.",goto:"end"},
  {bg:"radial-gradient(ellipse at 50% 50%,#050508 0%,#0a0a14 100%)",kanji:"光",name:"...",sprite:"normal",text:"Некоторые нити рвутся. Некоторые затягиваются в узел, который нельзя развязать. Это история об одной из них."},
  {bg:"#000",kanji:"赤",name:"",sprite:"normal",text:"",goto:"end"}
];

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let idx=0,typing=false,typeTimer=null,waitingChoice=false,gameStarted=false;
let currentSprite='normal';

const bgEl=document.getElementById('bg'),kanjiChar=document.getElementById('kanji-char');
const nameTag=document.getElementById('name-tag'),dialogueText=document.getElementById('dialogue-text');
const choicesDiv=document.getElementById('choices'),tapHint=document.getElementById('tap-hint');
const flashEl=document.getElementById('flash'),distortLayer=document.getElementById('distort');
const chapterCard=document.getElementById('chapter-card'),spriteImg=document.getElementById('sprite-img');
const vignetteEl=document.getElementById('vignette'),endScreen=document.getElementById('end-screen');

function setSprite(state){
  if(state===currentSprite)return;
  currentSprite=state;
  spriteImg.classList.add('changing');
  setTimeout(()=>{
    spriteImg.src=IMGS[state]||IMGS.normal;
    if(state==='blood'||state==='blood2')spriteImg.style.filter='drop-shadow(0 0 30px rgba(139,0,0,0.9))';
    else if(state==='crazy')spriteImg.style.filter='drop-shadow(0 0 25px rgba(80,0,80,0.8)) contrast(1.05)';
    else if(state==='broken')spriteImg.style.filter='drop-shadow(0 0 40px rgba(139,0,0,1)) saturate(0.8) contrast(1.15)';
    else spriteImg.style.filter='drop-shadow(0 0 20px rgba(139,0,0,0.5))';
    spriteImg.classList.remove('changing');
  },250);
}

function addDistortion(level){
  if(level==='glitch'){
    distortLayer.style.background='repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,0,60,0.04) 2px,rgba(255,0,60,0.04) 4px)';
    distortLayer.style.opacity='1';
    setTimeout(()=>{distortLayer.style.opacity='0';},500);
    spriteImg.style.transition='transform 0.05s';
    spriteImg.style.transform='translateX(-4px)';
    setTimeout(()=>{spriteImg.style.transform='translateX(4px)';},60);
    setTimeout(()=>{spriteImg.style.transform='none';spriteImg.style.transition='filter 0.8s,opacity 0.5s';},120);
  }else if(level==='distort'){
    distortLayer.style.background='repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(0,255,200,0.015) 3px,rgba(0,255,200,0.015) 6px)';
    distortLayer.style.opacity='0.7';
  }else if(level==='flash'){
    flashEl.style.background='#fff';flashEl.style.opacity='0.85';flashEl.style.transition='opacity 0.1s';
    setTimeout(()=>{flashEl.style.opacity='0';flashEl.style.transition='opacity 0.7s';},80);
  }else if(level==='drip'){
    for(let i=0;i<3;i++){
      const d=document.createElement('div');d.className='drip';
      d.style.left=(20+Math.random()*60)+'%';d.style.animationDuration=(0.8+Math.random()*0.8)+'s';
      document.getElementById('game').appendChild(d);setTimeout(()=>d.remove(),1800);
    }
  }else if(level==='tension'){
    vignetteEl.style.background='radial-gradient(ellipse at center,transparent 25%,rgba(80,0,0,0.75) 100%)';
    setTimeout(()=>{vignetteEl.style.background='radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.9) 100%)';},900);
  }else{distortLayer.style.opacity='0';}
}

function typeWrite(text,cb){
  dialogueText.textContent='';typing=true;let i=0;tapHint.style.display='none';
  function next(){
    if(i<text.length){dialogueText.textContent+=text[i++];typeTimer=setTimeout(next,26+Math.random()*14);}
    else{typing=false;tapHint.style.display='block';if(cb)cb();}
  }
  next();
}

function finishType(){
  if(typeTimer)clearTimeout(typeTimer);
  dialogueText.textContent=SCENES[idx].text;
  typing=false;tapHint.style.display='block';
}

function showChapter(num,title,cb){
  document.getElementById('chapter-num').textContent=num;
  document.getElementById('chapter-title').textContent=title;
  chapterCard.classList.add('show');
  setTimeout(()=>{chapterCard.classList.remove('show');setTimeout(cb,400);},2000);
}

function showEnd(){
  stopAllMusic(3);
  endScreen.classList.add('show');
  setTimeout(()=>{endScreen.classList.add('visible');},100);
}

function restartGame(){
  endScreen.classList.remove('show','visible');
  idx=0;typing=false;waitingChoice=false;currentSprite='normal';
  spriteImg.src=IMGS.normal;spriteImg.style.filter='drop-shadow(0 0 20px rgba(139,0,0,0.5))';
  tapHint.textContent='нажми, чтобы продолжить ▾';
  const ts=document.getElementById('title-screen');
  ts.style.display='flex';ts.style.opacity='1';ts.style.transition='none';
  gameStarted=false;
  playMenuMusic();
}

function renderScene(scene){
  if(!scene)return;
  if(scene.chapter){
    showChapter(scene.chapter,scene.chapterTitle,()=>{idx++;renderScene(SCENES[idx]);});
    return;
  }
  if(scene.bg)bgEl.style.background=scene.bg;
  if(scene.kanji)kanjiChar.textContent=scene.kanji;
  if(scene.sprite)setSprite(scene.sprite);
  nameTag.textContent=scene.name||'';
  if(scene.sfx)addDistortion(scene.sfx);
  choicesDiv.innerHTML='';choicesDiv.style.display='none';waitingChoice=false;
  if(scene.type==='choice'){
    typeWrite(scene.text,()=>{
      tapHint.style.display='none';choicesDiv.style.display='flex';waitingChoice=true;
      scene.choices.forEach(c=>{
        const btn=document.createElement('button');btn.className='choice-btn';btn.textContent=c.text;
        btn.onclick=(e)=>{e.stopPropagation();waitingChoice=false;choicesDiv.style.display='none';idx=c.next;renderScene(SCENES[idx]);};
        choicesDiv.appendChild(btn);
      });
    });
  }else{
    typeWrite(scene.text,()=>{});
  }
}

function handleTap(){
  if(!gameStarted||waitingChoice)return;
  if(typing){finishType();return;}
  const scene=SCENES[idx];
  if(!scene)return;
  if(scene.goto==='end'){showEnd();return;}
  if(scene.goto!==undefined){idx=scene.goto;renderScene(SCENES[idx]);return;}
  idx++;
  if(idx>=SCENES.length){showEnd();return;}
  renderScene(SCENES[idx]);
}

function startGame(){
  initAudio();
  const ts=document.getElementById('title-screen');
  ts.style.transition='opacity 1s';ts.style.opacity='0';
  setTimeout(()=>{
    ts.style.display='none';
    gameStarted=true;
    playGameMusic();
    renderScene(SCENES[idx]);
  },1000);
}

// Запуск меню музыки при первом касании
let menuStarted=false;
document.addEventListener('click',function initMenuAudio(){
  if(!menuStarted){
    menuStarted=true;
    playMenuMusic();
  }
  document.removeEventListener('click',initMenuAudio);
},{once:true});
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
